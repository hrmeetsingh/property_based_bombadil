<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1024" />
  <!-- Inline empty favicon so the test run never triggers a 404 (noHttpErrorCodes) -->
  <link rel="icon" href="data:," />
  <title>Acme Onboarding</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <h1 id="form-title">Create your account</h1>
      <p class="subtitle">Tell us a little about yourself.</p>

      <form id="onboarding-form" novalidate>
        <div class="field">
          <label for="first-name">First name</label>
          <input id="first-name" name="firstName" type="text" autocomplete="given-name" />
          <span class="error" id="first-name-error" data-error-for="first-name" hidden></span>
        </div>

        <div class="field">
          <label for="last-name">Last name</label>
          <input id="last-name" name="lastName" type="text" autocomplete="family-name" />
          <span class="error" id="last-name-error" data-error-for="last-name" hidden></span>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" />
          <span class="error" id="email-error" data-error-for="email" hidden></span>
        </div>

        <div class="field">
          <label for="address">Address</label>
          <input id="address" name="address" type="text" autocomplete="street-address" />
          <span class="error" id="address-error" data-error-for="address" hidden></span>
        </div>

        <button type="submit" id="submit-button">Submit</button>
      </form>

      <div class="success" id="success-panel" hidden>
        <h2 id="success-heading">You're all set!</h2>
        <p id="success-message"></p>
        <button type="button" id="reset-button">Register another person</button>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
